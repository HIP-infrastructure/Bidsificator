# Bidsificator Configuration Template
# Copy this file to config.yaml and customize for your data structure

# Data source paths
data_paths:
  # Option 1: Single database (most common)
  main: "/path/to/your/data"
  
  # Option 2: Separate databases (uncomment if needed)
  # anatomical: "/path/to/anatomical/data"
  # functional: "/path/to/functional/data"

# How subjects are named (glob pattern)
# Examples:
#   - Lyon format: "*_*_*" (HOSPITAL_YEAR_PATIENT)
#   - Grenoble format: "sub-*" (sub-ID)
#   - Generic: "PAT_*" (PAT_ID)
subject_pattern: "PAT_*"

# File types to find for each subject
file_types:
  # EEG data example
  eeg:
    description: "EEG recordings"
    folder: "."  # relative to subject folder
    extensions: [".TRC", ".edf"]
    
  # MRI data examples
  mri_pre:
    description: "Pre-surgery T1 MRI"
    folder: "mri/T1pre_*"  # supports wildcards
    extensions: [".nii", ".nii.gz"]
    
  mri_post:
    description: "Post-surgery T1 MRI"
    folder: "mri/T1post_*"
    extensions: [".nii", ".nii.gz"]
    
  # Complex folder pattern example (using subject pattern placeholder)
  eeg_sessions:
    description: "EEG session data"
    folder: "${subject_pattern}_*"  # replaced with actual subject ID
    extensions: [".TRC", ".edf"]
