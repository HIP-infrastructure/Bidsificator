[project]
name = "bidsificator"
version = "1.14.0"
description = "A PyQt6 application for managing BIDS datasets"
authors = [{ name = "Florian Sipp", email = "florian.sipp@chuv.ch" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = ["BIDS", "neuroimaging", "iEEG", "EEG", "MRI", "data-management"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Dependencies stay in [tool.poetry.dependencies] (below) to keep the caret
# constraints and the existing lock; declared dynamic so Poetry sources them.
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/HIP-infrastructure/Bidsificator"

[project.scripts]
bidsificator = "bidsificator.main:main"
bidsificator-api = "bidsificator.api:main"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pyqt6 = "^6.10.2"

# bids
numpy = "^2.4"
pandas = "^2.3"
dicom2nifti = ">=2.6.2"
bids_validator = ">=1.14.5"

# TRC (Micromed) → EDF conversion is handled by the bundled PyEEGFormat wrapper
# (bidsificator/core/PyEEGFormat), so no mne/neo stack is needed here.

# API
flasgger = "^0.9.7"
flask = "^3.1"
flask-cors = "^6.0"
flask-httpauth = "^4.8"
flask_caching = "^2.3.1"
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
ruff = "^0.14"
pytest-cov = "^7.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"
# Generated Qt UI modules and the vendored PyEEGFormat binaries/wrappers are not
# ours to lint.
extend-exclude = ["bidsificator/forms/*_ui.py", "bidsificator/core/PyEEGFormat"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Legacy PascalCase module names are grandfathered; the N rules stay off.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["bidsificator"]
# Generated Qt UI modules and the vendored PyEEGFormat binaries are not our code
# to cover; the acceptance target for PR 10 is coverage of hand-written code.
omit = ["bidsificator/forms/*_ui.py", "bidsificator/core/PyEEGFormat/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.lock,./bidsificator/schema/bids_schema.json'
check-hidden = true
# ignore-regex = ''
ignore-words-list = 'nd'  # 'nd' is a valid BIDS value meaning "not determined"
